# 파이프라인 설정
topic:
  main: "IT·가전 제품 구매 가이드"
  sub: "개발자·재택근무 생산성 장비"
  seed_keywords: ["모니터 추천", "기계식 키보드 추천", "노트북 추천", "모니터암 추천", "웹캠 추천", "USB 허브 추천", "스마트홈", "AI 스피커"]
  intent_words: ["추천", "후기", "비교", "가격", "단점", "vs"]   # 구매 의도 키워드 가점

schedule:
  posts_per_week: 5
  publish_days: ["tue", "wed", "thu", "fri", "sat"]
  max_posts_per_day: 1

content_mix:            # 합계 1.0 — 실험 설정이 덮어씀
  course: 0.6
  curation: 0.2
  gear: 0.15
  nomad: 0.05

models:
  writer: sonnet      # claude -p --model 값. 구독 계정 사용, API 키 불필요
  reviewer: opus

review:
  min_chars: 1500
  min_headings: 3
  min_chars_per_section: 200
  min_photo_slots: 5
  min_experience_sentences: 3
  max_external_links: 1
  hashtags: [5, 10]
  max_title_len: 30
  max_similarity: 0.30
  min_score: 7
  max_regenerations: 2

research:
  min_monthly_volume: 1000
  max_monthly_volume: 10000
  min_personal_blog_ratio: 0.4
  competition_bonus: 1.0     # 점수 = 검색량 × 개인비율 × (1 + bonus × 경쟁도). 경쟁도 = 광고주 수요 = 단가
  intent_bonus: 0.5          # 구매 의도 단어 포함 시 가점
  candidates_per_week: 100
